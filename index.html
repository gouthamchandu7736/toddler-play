<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Toddler lockdown viewport:
      - user-scalable=no + maximum-scale=1 kills pinch-zoom and double-tap-zoom
      - viewport-fit=cover lets us paint under notches; safe areas handled in CSS
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6d216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The name shown under the icon when added to an iOS home screen. -->
    <meta name="apple-mobile-web-app-title" content="Aditi" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Aditi's Playhouse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
