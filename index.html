<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Toddler lockdown viewport:
      - user-scalable=no + maximum-scale=1 kills pinch-zoom and double-tap-zoom
      - viewport-fit=cover lets us paint under notches; safe areas handled in CSS
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7cc576" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Play" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Play</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
